name: Deploy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocket-voxel-web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, verify, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://pocketvoxel.games/

    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Check deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Missing repository variable CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: wasm-bindgen@0.2.126

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Web release
        run: bun run web:build

      - name: Check types
        run: bun run tsc

      - name: Run tests
        run: bun test tests/

      - name: Verify Web release
        run: |
          bunx wrangler types worker/worker-configuration.d.ts --check
          bunx wrangler deploy --dry-run

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify production
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            https://pocketvoxel.games/ >/dev/null
          manifest_matches=false
          for _ in {1..10}; do
            if diff --unified web/platform/manifest.json \
              <(curl --fail --silent --show-error \
                https://pocketvoxel.games/platform/manifest.json); then
              manifest_matches=true
              break
            fi
            sleep 3
          done
          test "$manifest_matches" = true
          headers="$(curl --silent --show-error --head \
            http://pocketvoxel.games/deploy-check?source=github-actions \
            | tr -d '\r')"
          grep -Eq '^HTTP/[^ ]+ 308' <<<"$headers"
          grep -Eiq '^location: https://pocketvoxel\.games/deploy-check\?source=github-actions$' \
            <<<"$headers"
