# The desktop-buildable workspace: the presentation core and the headless
# sim host. The console crates stay standalone lone crates, exactly as they
# were in the incubating repo (docs/VOXEL.md §2):
#   crates/pocketvoxel-gu   PSP-only sceGu backend (cargo-psp toolchain)
#   crates/pocketvoxel-psp  the EBOOT (cargo-psp; must live outside any
#                           workspace — the hosts/psp rule)
#   crates/pocketvoxel-gxm  Vita-only raw-GXM backend (cargo-vita toolchain)
#   crates/pocketvoxel-vita the VPK (cargo-vita, same lone-bin rule)
# vendor/ keeps the engine's own workspaces out of this one.
[workspace]
resolver = "2"
members = [
    "crates/pocketvoxel-core",
    "crates/pocketvoxel-packager-wasm",
    "crates/pocketvoxel-sim",
    "crates/pocketvoxel-wasm",
]
exclude = [
    "crates/pocketvoxel-iphone4s",
    "crates/pocketvoxel-gxm",
    "crates/pocketvoxel-gu",
    "crates/pocketvoxel-psp",
    "crates/pocketvoxel-vita",
    "vendor",
]

[profile.release]
opt-level = 3
